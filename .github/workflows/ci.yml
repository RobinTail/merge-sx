# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  pull-requests: write # for comments in PRs

jobs:
  unitTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Testing
        run: |
          pnpm run lint
          pnpm run test
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.github_token }}
      - name: Benchmark
        run: pnpm exec vitest bench --run --outputJson bench.json
      - name: Benchmark processing
        id: bench
        if: github.event_name == 'pull_request'
        run: |
          echo 'comment<<EOF' >> $GITHUB_OUTPUT
          echo "# Performance benchmark" >> $GITHUB_OUTPUT
          echo ${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          node tools/benchmark.processor.ts >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
      - name: Find Benchmark Comment
        id: fc
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: benchmark
      - name: Maintain Benchmark Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: ${{ steps.fc.outputs.comment-id == '' && 'append' || 'replace' }}
          reactions: ${{ steps.fc.outputs.comment-id == '' && 'rocket' || 'hooray' }}
          body: ${{ steps.bench.outputs.comment }}

  integrationTest:
    needs: unitTest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mui-version:
        - 5.1.0
        - ^5
        - 6.0.0
        - ^6
        - 7.0.0
        - ^7
        - 9.0.0
        - ^9
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        env:
          MUI_VERSION: ${{ matrix.mui-version }}
        run: |
          cat >packages/integration-test/package.json <<EOF
            {
              "name": "integration-test",
              "version": "1.0.0",
              "license": "MIT",
              "type": "module",
              "dependencies": {
                "merge-sx": "workspace:*",
                "@mui/material": "${MUI_VERSION}"
              }
            }
          EOF
          cat packages/integration-test/package.json
          pnpm install --filter integration-test --no-frozen-lockfile
          pnpm run intTest
